<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Styled To-Do List</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="container">

                        <li>
                            <a class="sub-item-link" href="/" target="_blank">Watch this video</a>

                    </ul>
                </li>
                <li>
                    <input type="checkbox" id="second-item">
                    <label for="second-item">Create first model prototype</label>

                </li>
                <li>
                    <input type="checkbox" id="third-item">

                    <ul class="sub-item">
                        <li>
                            <a class="sub-item-link" href="/" target="_blank">Download this paper</a>

                    </ul>
                </li>
                <li>
                    <input type="checkbox" id="fourth-item">
                    <label for="fourth-item">Look for compiler manuals</label>

                        <li>
                            <a class="sub-item-link" href="/" target="_blank">Visit this repository</a>
                        </li>

            </ul>
        </div>

</html>
